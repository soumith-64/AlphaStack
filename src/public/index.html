<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INAI — 143 · Oru Ping, Oru Bond.</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; background: #080e1a; color: #f8fafc; display: flex; align-items: center; justify-content: center; }
    .loader-box { text-align: center; }
    .loader-logo { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 14px; animation: bounce 1s infinite alternate; }
    .loader-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
    .loader-sub { font-size: 13px; color: #94a3b8; margin-top: 6px; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  </style>
  <script>
    (function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
      const target = isMobile ? '/mobile/' : '/desktop/';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="loader-box">
    <img src="/assets/logo.png" alt="INAI Logo" class="loader-logo">
    <div class="loader-title">INAI</div>
    <div class="loader-sub">143 · Oru Ping, Oru Bond.</div>
  </div>
</body>
</html>
