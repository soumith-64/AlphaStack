<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneMail — Phone-Number-Powered Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b141a; color: #fff; }

    /* Top Judge / Evaluator Switcher Bar */
    .top-switcher-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(18, 27, 34, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 99999;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #25D366;
    }

    .brand-title span { color: #fff; font-size: 13px; font-weight: 400; opacity: 0.8; }

    .nav-pills {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e9edef;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .pill-btn.active {
      background: #25D366;
      color: #0b141a;
      border-color: #25D366;
      font-weight: 600;
    }

    .frame-container {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 48px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 650px) {
      .brand-title span { display: none; }
      .pill-btn { padding: 4px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- Floating Switcher Bar for Hackathon Judges -->
  <div class="top-switcher-bar">
    <div class="brand-title">
      📱 PhoneMail <span>(AlphaStack Buildathon)</span>
    </div>
    <div class="nav-pills">
      <button class="pill-btn" id="btn-mobile" onclick="switchView('mobile')">📱 Mobile Client</button>
      <button class="pill-btn" id="btn-desktop" onclick="switchView('desktop')">💻 Desktop Client</button>
      <button class="pill-btn" id="btn-portal" onclick="switchView('portal')">🌐 2-Field Portal</button>
      <button class="pill-btn" id="btn-simulator" onclick="switchView('simulator')">🧪 Judge Lab</button>
    </div>
  </div>

  <div class="frame-container">
    <iframe id="main-frame" src="/mobile/"></iframe>
  </div>

  <script>
    // Intelligent viewport detection
    const isMobileViewport = window.innerWidth < 768;
    const initialView = isMobileViewport ? 'mobile' : 'desktop';

    function switchView(viewName) {
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${viewName}`);
      if (activeBtn) activeBtn.classList.add('active');

      const frame = document.getElementById('main-frame');
      frame.src = `/${viewName}/`;
      history.replaceState(null, null, `?view=${viewName}`);
    }

    // Check query params or viewport
    const urlParams = new URLSearchParams(window.location.search);
    const requestedView = urlParams.get('view') || initialView;
    switchView(requestedView);
  </script>

</body>
</html>
