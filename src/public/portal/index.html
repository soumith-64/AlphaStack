<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneMail — Web Registration Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: #e0e1dd;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .kiosk-badge {
      background: rgba(37, 211, 102, 0.15);
      color: #25D366;
      border: 1px solid rgba(37, 211, 102, 0.3);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      text-align: center;
    }

    .header-subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .country-prefix {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-weight: 600;
      font-size: 15px;
    }

    input[type="tel"], input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 14px 14px 50px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }

    input.no-prefix {
      padding-left: 16px;
      letter-spacing: 4px;
      font-weight: 600;
      font-size: 18px;
    }

    input:focus {
      border-color: #25D366;
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
    }

    .otp-helper {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .auto-fill-btn {
      color: #25D366;
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      background: #25D366;
      color: #0b141a;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #20ba59;
      transform: translateY(-1px);
    }

    .notification-toast {
      position: fixed;
      bottom: 30px;
      background: #0f172a;
      border: 1px solid #25D366;
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .notification-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .reset-indicator {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="kiosk-badge">🏢 Web Portal (Registration Only)</div>

  <div class="card">
    <h1 class="header-title">Create PhoneMail</h1>
    <p class="header-subtitle">Just 2 fields required. Fields auto-reset immediately after account creation for the next user.</p>

    <form id="portal-form">
      <!-- Field 1: Phone Number -->
      <div class="form-group">
        <label for="phone-number">1. Phone Number</label>
        <div class="input-wrapper">
          <span class="country-prefix">+91</span>
          <input type="tel" id="phone-number" placeholder="9876543210" maxlength="10" required autofocus>
        </div>
      </div>

      <!-- Field 2: OTP -->
      <div class="form-group">
        <label for="otp-code">2. OTP Verification Code</label>
        <div class="input-wrapper">
          <input type="text" class="no-prefix" id="otp-code" placeholder="123456" maxlength="6" required>
        </div>
        <div class="otp-helper">
          <span>Demo verification code: <strong>123456</strong></span>
          <button type="button" class="auto-fill-btn" onclick="document.getElementById('otp-code').value='123456'">Auto-fill</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Create Account</button>
    </form>

    <p class="reset-indicator">⚡ Fields will clear automatically on submission</p>
  </div>

  <div class="notification-toast" id="toast">
    <span>✅</span>
    <div id="toast-message">Account created successfully!</div>
  </div>

  <script>
    const form = document.getElementById('portal-form');
    const phoneInput = document.getElementById('phone-number');
    const otpInput = document.getElementById('otp-code');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');

    function showToast(message) {
      toastMsg.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = phoneInput.value.trim();
      const otp = otpInput.value.trim();

      if (!phone || phone.length < 10) {
        alert('Please enter a valid 10-digit phone number.');
        return;
      }

      try {
        const res = await fetch('/api/auth/portal-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone, otp })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast(`🎉 Account created! Email: ${data.emailAddress}`);
          // SPEC REQUIREMENT: "On creation, the fields must reset for the next account creation."
          form.reset();
          phoneInput.focus();
        } else {
          alert(data.error || 'Failed to create account');
        }
      } catch (err) {
        alert('Connection error: ' + err.message);
      }
    });
  </script>
</body>
</html>
